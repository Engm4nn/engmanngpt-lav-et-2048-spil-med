<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spil med Highscore</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Mit Spil</h1>
        <div id="game-area">
            <!-- Spillets indhold vil blive tilføjet her -->
        </div>
        <div class="game-info">
            <p>Score: <span id="current-score">0</span></p>
            <button id="reset-button">Nyt Spil</button>
        </div>
        <div class="highscore-container">
            <h2>Highscores</h2>
            <ol id="highscore-list"></ol>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
